name: luma-drift

# Compares content/events/*.toml against the Luma calendar's ICS feed.
#
# This is deliberately not a pull request gate. It reaches out to Luma, and it
# fails for content reasons ("September is live, fill in luma_url") rather than
# code reasons, so gating merges on it would turn an unrelated CSS change red
# and teach everyone to ignore the result. Weekly is enough: Luma pages go up
# about two weeks before each event, so every event gets caught at least once
# before it happens.
on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, 13:00 UTC (~09:00 in Ottawa)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  drift:
    name: content/events vs Luma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Compare content/events with the Luma feed
        run: cargo test --features ssr --no-default-features --test luma_drift -- --ignored --nocapture
