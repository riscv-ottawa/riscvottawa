name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_LEPTOS_VERSION: 0.3.6

jobs:
  check:
    name: fmt + clippy + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (ssr)
        run: cargo clippy --features ssr --no-default-features --all-targets -- -D warnings

      - name: Clippy (hydrate)
        run: cargo clippy --features hydrate --no-default-features --target wasm32-unknown-unknown --lib -- -D warnings

      # Skips the Luma drift check, which is #[ignore]d because it needs the
      # network. That one runs on a schedule in luma-drift.yml.
      - name: Tests
        run: cargo test --features ssr --no-default-features

      - name: Install cargo-leptos
        run: cargo install --locked cargo-leptos --version ${{ env.CARGO_LEPTOS_VERSION }}

      - name: Release build
        run: cargo leptos build --release
