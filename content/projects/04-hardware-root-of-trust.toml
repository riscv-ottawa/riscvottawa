title = "Hardware Root of Trust Training"
level = "advanced"
summary = "Learn how to boot a real open-source secure element (Pavona Egret) in Verilator and decompose the hardware root of trust subsystem by subsystem, from secure boot and DICE identity to attestation, PQC, and provisioning"
description = """
Takes a real open-source root of trust (OpenTitan and Pavona Egret), boots it in the Verilator simulator on a laptop, and pulls it apart subsystem by subsystem until the full chain of trust is understood end to end.
Covers what a root of trust is and why open silicon matters, building and running the Egret chip in simulation, secure boot from ROM to owner firmware, DICE identity and key derivation, attestation and certificate chains, secure storage, post-quantum cryptography coprocessors, provisioning and ownership transfer, and driving Egret as a discrete secure element over SPI from a host processor.
Everything runs in simulation; no expensive FPGA or silicon required!
"""
prerequisites = ["C", "shell", "rtl", "verilator", "cryptography"]
website_url = "https://hwrot.riscvottawa.ca/"
