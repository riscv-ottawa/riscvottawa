description = """
Join us for the July meetup of RISC-V Ottawa (RVO). The evening opens with a welcome and a beginner-friendly introduction to RISC-V covering what it is and why it matters, followed by an invited talk from a member of RISC-V International. We'll then hear project updates from members working on CVA5, RISC-V workload profiling, and HWRoT, plus a longer featured talk on FOSSi FPGA tooling, finally closing with remarks and a look ahead to our next meetup. Whether you are a student, seasoned professional, or simply someone curious about what RISC-V has to offer, you'll find a pressure-free space to learn, build, and connect. All welcome.
"""
