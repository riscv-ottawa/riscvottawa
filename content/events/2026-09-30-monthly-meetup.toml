location = "Location to be announced soon"
summary = "September is our biggest night yet, offering: a Q&A style panel on where the RISC-V ecosystem stands in 2026 and where Canada fits, an invited talk from RISC-V International on how to get involved, member project tables, and the first public look at a major project RVO is starting. Free, all welcome."
description = """
September is not our regular meetup, it's something larger. RISC-V International joins us to talk about the programs universities and academics can use to get involved, and a five-person panel takes on the state of RISC-V hardware and software in 2026 and where Canadian engineers, researchers, and companies fit into it. Over the break, RVO members bring their in-flight projects to tables you can walk up to. The evening closes with the first public look at a project we are starting, including its phase one roadmap and how to get involved. No RISC-V experience assumed, and it costs nothing.
"""
luma_url = "https://luma.com/kiulkbm4"
tags = ["open", "meetup", "monthly", "panel", "spotlight", "guest-speaker"]

[spotlight]
kicker = "our biggest night yet"
headline = "RISC-V in 2026: Where the Ecosystem Stands, and Where Canada Fits"
tagline = """
An evening on the state of RISC-V hardware and software, and how Canadian engineers, students, researchers, and companies can get involved.

Free, in Ottawa, no experience assumed.
"""
draws = [
    "A Q&A style panel on where the RISC-V ecosystem actually stands in 2026, and where Canada fits into it, with panelists being the ones already contributing to the RISC-V hardware and the software ecosystem.",
    "RISC-V International on the programs universities and academics can use to get involved.",
    "The first public look at a major project RVO is starting: the phase one roadmap, how to get involved, and the talent that it will foster.",
]

