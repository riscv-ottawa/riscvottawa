summary = "The August meetup of RISC-V Ottawa features two technical presentations, one on verifying the CVA5 core with UVM and the other on RISC-V secure boot in safety-critical systems, along with RVO member project updates and time to network with professionals, students, and hobbyists. All welcome."
description = """
Join us for the August meetup of RISC-V Ottawa (RVO). The evening opens with a welcome to the makerspace from our host, followed by two featured technical presentations: Alfredo on CVA5, UVM, and the verification plan, and Mouad on "Auditable Is Not Assured: RISC-V, secure boot, and what it takes to trust a machine with a life". We'll then hear short project updates from members working on RISC-V workload profiling, hardware root of trust, a multi-MCU native simulator, and an ESP32-C6 dice roll in Rust, before closing with remarks and a look ahead to our next meetup. Whether you are a student, seasoned professional, or simply someone curious about what RISC-V has to offer, you'll find a pressure-free space to learn, build, and connect. All welcome.
"""
