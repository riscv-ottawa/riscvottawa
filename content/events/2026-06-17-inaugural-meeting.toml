summary = "The inaugural meeting of the RISC-V Ottawa group brings together developers, students, and hobbyists to shape the group's future. The agenda includes talks by invited speakers on the RISC-V hardware and software ecosystem, an overview and status update for RISC-V Ottawa, collaborative project brainstorming, and a networking mixer."
description = """
Join us for the inaugural meeting of RISC-V Ottawa (RVO), where attendees are co-creators in shaping the group's direction. The evening opens with a welcome and introduction to RISC-V Ottawa, followed by talks from Mike Thompson (OpenHW Foundation) on the open-source RISC-V ecosystem and Frédéric Desbiens (Eclipse Foundation) on open-source RTOSes, and an overview and status update of RISC-V Ottawa from one of the co-founders. We'll then move into collaborative project brainstorming and pitches, before closing out with a networking mixer as a chance to connect with developers, students, and hobbyists from across the Ottawa ecosystem.

See the Luma page for more details.
